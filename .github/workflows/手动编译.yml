name: 手动编译tailscale

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译 github.com/tailscale/tailscale 分支或版本号，默认 v1.68.0'
        required: true
        default: 'v1.68.0'
      name:
        description: '自定义版本号后缀（追加到 ./tailscaled -version 第一行）'
        required: false
        default: ''
      extra:
        description: '自定义短语（显示为 -version 的“额外信息”）'
        required: false
        default: ''
      tspath:
        description: '自定义密钥路径（官方默认：/var/lib/tailscale/tailscaled.state；必须是绝对路径；日志建议重定向到 /tmp）'
        required: false
        default: ''
      target:
        description: '请选择linux目标CPU架构'
        required: true
        type: choice
        default: 'aarch64'
        options:
          - aarch64
          - armv7
          - armv6
          - armv5
          - arm
          - mipsel
          - mips
          - mips64
          - mips64le
          - ppc64le
          - s390x
          - i386
          - x86_64
      upx:
        description: '编译完成后是否使用upx压缩，部分架构压缩后运行异常'
        required: true
        default: false
        type: boolean

env:
  branch: "${{ github.event.inputs.branch }}"
  target: "${{ github.event.inputs.target }}"
  name: "${{ github.event.inputs.name }}"
  extra: "${{ github.event.inputs.extra }}"
  tspath: "${{ github.event.inputs.tspath }}"
jobs:
 tailscale:
    runs-on: ubuntu-latest
    steps:
      - name: 获取最新Go
        run: |
          latest_version=$(curl -L -k -s https://golang.org/dl/?mode=json | grep -m 1 -o '"version": "[^"]*' | sed 's/"version": "//' | tr -d 'go" ')
          echo "go版本=$latest_version"
          echo "gotag=$latest_version" >> $GITHUB_ENV
      - name: 安装go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.gotag }}
      - name: 开始编译
        run: |
            git clone -b $branch https://github.com/tailscale/tailscale /opt/tailscale
            cd /opt/tailscale
            export CGO_ENABLED=0
            export GOOS=linux
            case $target in 
              aarch64)
                export GOARCH=arm64
                ;;
              armv7)
                export GOARCH=arm
                export GOARM=7
                ;;
              armv6)
                export GOARCH=arm
                export GOARM=6
                ;;
              armv5)
                export GOARCH=arm
                export GOARM=5
                ;;
              arm)
                export GOARCH=arm
                ;;
              mipsel)
                export GOARCH=mipsle
                export GOMIPS=softfloat
                ;;
              mips)
                export GOARCH=mips
                export GOMIPS=softfloat
                ;;
              mips64)
                export GOARCH=mips64
                ;;
              mips64le)
                export GOARCH=mips64le
                ;;
              ppc64le)
                export GOARCH=ppc64le
                ;;
              s390x)
                export GOARCH=s390x
                ;;
              i386)
                export GOARCH=386
                ;;
              x86_64)
                export GOARCH=amd64
                ;;
            esac
            version=$(cat ./VERSION.txt)
            short="${version}"
            if [ -n "${name}" ]; then
              short="${short} ${name}"
            fi
            #sed -i 's/getEmbeddedInfo().commit/""/g' ./version/version.go
            if [ -n "${{ github.event.inputs.tspath }}" ]; then
              case "${{ github.event.inputs.tspath }}" in
                /*) ;;
                *) echo "错误：密钥路径必须是绝对路径"; exit 1 ;;
              esac
              sed -i "s|return \"/var/lib/tailscale/tailscaled.state\"|return \"${{ github.event.inputs.tspath }}\"|g" ./paths/paths_unix.go
              grep -qF "return \"${{ github.event.inputs.tspath }}\"" ./paths/paths_unix.go || { echo "错误：密钥路径替换失败，上游源码可能已变化"; exit 1; }
              echo "修改密钥文件路径为：${{ github.event.inputs.tspath }}"
            fi
            # 上游只在状态文件父目录名为 tailscale 时才推导 VarRoot（TLS 证书、Taildrop 临时文件用）；
            # 自定义路径如 /etc/storage/tailscale/lib 会让 VarRoot 为空，这里改为任意绝对路径都推导。
            if grep -q 'strings.EqualFold(filepath.Base(dir), "tailscale")' ./cmd/tailscaled/tailscaled.go; then
              sed -i 's|strings.EqualFold(filepath.Base(dir), "tailscale")|dir != ""|' ./cmd/tailscaled/tailscaled.go
            else
              echo "提示：当前版本没有 VarRoot 推导逻辑，自定义密钥目录请同时传 --statedir"
            fi
            # 去掉 derper manual 证书模式对 SNI 与 --hostname 不一致的拒绝，
            # 避免客户端用 IP 或其他域名连接时报 cert mismatch with hostname。
            # 改成 if false 而不是删 3 行，避免上游 if 块变化时误删其他代码。
            if grep -q 'hi.ServerName != m.hostname' ./cmd/derper/cert.go; then
              sed -i 's#if hi.ServerName != m.hostname && !m.noHostname {#if false {#' ./cmd/derper/cert.go
              if grep -q 'hi.ServerName != m.hostname' ./cmd/derper/cert.go; then
                echo "错误：derper 证书主机名校验移除失败"; exit 1
              fi
            elif grep -q 'cert mismatch with hostname' ./cmd/derper/cert.go; then
              echo "错误：derper 仍存在 cert mismatch with hostname 校验，请检查上游改动"; exit 1
            else
              echo "提示：当前 derper 源码没有该主机名校验"
            fi
            # 只改 dirtyString 的返回值，避免把源码注释里的 -dirty 一起删掉
            sed -i 's|return "-dirty"|return ""|' ./version/version.go
            # 将 -version 的英文提示改成中文；上游改文案时这些 sed 会静默失效
            # 按需求不输出 -version 里的 track 提示
            sed -i 's|fmt.Fprintf(&ret, "  track: unstable (dev); frequent updates and bugs are likely\\n")|// track 提示已按需求移除|' ./version/print.go
            sed -i 's#"  other commit: %s\\n", extraGitCommitStamp#"  额外信息: %s\\n", extraGitCommitStamp#g' ./version/print.go
            sed -i 's#"  tailscale commit: %s%s\\n", gitCommit(), dirtyString()#"  当前版本提交hash值: %s\\n", gitCommit()#g' ./version/print.go
            sed -i 's#"  long version: %s\\n"#"  完整版本号: %s\\n"#g' ./version/print.go
            sed -i 's#"  go version: %s (tailscale/go %s)\\n"#"  go 版本: %s (tailscale/go %s)\\n"#g' ./version/print.go
            sed -i 's#"  go version: %s\\n"#"  go 版本: %s\\n"#g' ./version/print.go
            go build -buildvcs=false -trimpath -ldflags="-X 'tailscale.com/version.longStamp=${version}' -X 'tailscale.com/version.shortStamp=${short}' -X 'tailscale.com/version.extraGitCommitStamp=$extra' -s -w" tailscale.com/cmd/tailscale
            go build -buildvcs=false -trimpath -ldflags="-X 'tailscale.com/version.longStamp=${version}' -X 'tailscale.com/version.shortStamp=${short}' -X 'tailscale.com/version.extraGitCommitStamp=$extra' -s -w" tailscale.com/cmd/tailscaled
            go build -buildvcs=false -trimpath -ldflags="-X 'tailscale.com/version.longStamp=${version}' -X 'tailscale.com/version.shortStamp=${short}' -X 'tailscale.com/version.extraGitCommitStamp=$extra' -s -w" tailscale.com/cmd/derper
            mkdir -p /opt/bin
            echo "tailscale ：`ls -alh tailscale | awk '{print $5}'`"
            echo "tailscaled ：`ls -alh tailscaled | awk '{print $5}'`"
            echo "derper ：`ls -alh derper | awk '{print $5}'`"
            file tailscaled
            mv -f tailscale tailscaled derper /opt/bin/
      - name: 安装 UPX
        if: github.event.inputs.upx == 'true'
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.2.4
          install-only: true
      - name: UPX压缩
        if: github.event.inputs.upx == 'true'
        run: |
          cd /opt/bin
          upx --lzma --best tailscaled
          upx --lzma --best tailscale
          upx --lzma --best derper
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ env.target }}
          path: /opt/bin/*
